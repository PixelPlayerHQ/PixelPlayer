name: Commit Lint (Semantic)

# Keep this — cheap and useful. Runs on push/PR; not an APK build.
on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'chore/**', 'ci/**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commitlint-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Enforce conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19

      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

      - name: Lint push commits
        if: github.event_name == 'push'
        run: |
          # Validate every new commit on the push (range from before → after).
          # Force-pushes rewrite `before` so that SHA may no longer exist — fall back
          # to linting only HEAD instead of failing with "Invalid revision range".
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            echo "No previous SHA (new branch); linting HEAD only."
            npx commitlint --last --verbose
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Previous SHA $BEFORE is unreachable (likely force-push); linting HEAD only."
            npx commitlint --last --verbose
          else
            npx commitlint --from "$BEFORE" --to "${{ github.sha }}" --verbose
          fi

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | npx commitlint --verbose
