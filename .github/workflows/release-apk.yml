name: Release APK

# Builds a signed (CI keystore) release APK and publishes a GitHub Release with
# conventional-commit notes + downloadable APKs.
#
# Triggers:
# - Every push to master → continuous pre-release (auto tag + changelog)
# - Version tags (v*) → release for that tag
# - Manual workflow_dispatch → named version (e.g. 0.8.1-soundcloud)
on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (e.g. 0.8.0-soundcloud)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
            PRERELEASE="${{ inputs.prerelease }}"
            TITLE="PixelPlayer ${VERSION}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            # Tag releases with a dash (e.g. 0.8.1-soundcloud) stay pre-release.
            if [[ "${VERSION}" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
            TITLE="PixelPlayer ${VERSION}"
          else
            # Continuous build on every master push — browseable on the Releases page.
            VERSION="continuous-$(date -u +%Y%m%d)-${SHORT_SHA}"
            TAG="v${VERSION}"
            # Keep as a full release so /releases/latest always points here.
            PRERELEASE="false"
            TITLE="PixelPlayer continuous (${SHORT_SHA})"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          # Must fit in signed 32-bit Int (max 2147483647). yyMMddHHmm overflows.
          VERSION_CODE="$(( $(date -u +%s) / 60 ))"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved release ${TAG} (prerelease=${PRERELEASE}, versionCode=${VERSION_CODE})"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache keystore
        id: cache-keystore
        uses: actions/cache@v5
        with:
          path: vz-pixelplay.jks
          key: ${{ runner.os }}-keystore-vz-pixelplay

      - name: Generate keystore if not cached
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore vz-pixelplay.jks -alias pixelplay-key -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass 994273 -keypass 994273 \
            -dname "CN=PixelPlay, OU=Dev, O=PixelPlay, L=World, S=World, C=US"

      - name: Create keystore.properties
        run: |
          echo "storePassword=994273" > keystore.properties
          echo "keyAlias=pixelplay-key" >> keystore.properties
          echo "keyPassword=994273" >> keystore.properties

      - name: Build Phone release APKs
        run: >
          gradle :app:assembleRelease
          -Ppixelplay.enableAbiSplits=true
          -PAPP_VERSION_NAME=${{ steps.meta.outputs.version }}
          -PAPP_VERSION_CODE=${{ steps.meta.outputs.version_code }}

      - name: Verify APKs
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          done

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            "dist/PixelPlayer-${{ steps.meta.outputs.version }}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            "dist/PixelPlayer-${{ steps.meta.outputs.version }}-armeabi-v7a.apk"

      - name: Generate release notes from conventional commits
        id: notes
        uses: actions/github-script@v9
        with:
          script: |
            const { execSync } = require('child_process');
            const tag = '${{ steps.meta.outputs.tag }}';
            const version = '${{ steps.meta.outputs.version }}';

            let range = '';
            try {
              const tags = execSync('git tag --sort=-creatordate', { encoding: 'utf8' })
                .split('\n')
                .map((t) => t.trim())
                .filter(Boolean)
                .filter((t) => t !== tag);
              if (tags.length > 0) {
                range = `${tags[0]}..HEAD`;
              }
            } catch (_) {}

            const logCmd = range
              ? `git log ${range} --pretty=format:%s`
              : 'git log -30 --pretty=format:%s';
            const subjects = execSync(logCmd, { encoding: 'utf8' })
              .split('\n')
              .map((s) => s.trim())
              .filter(Boolean);

            const buckets = {
              feat: [],
              fix: [],
              perf: [],
              refactor: [],
              docs: [],
              chore: [],
              other: [],
            };

            const re = /^(feat|fix|perf|refactor|docs|chore|ci|build|test|style|revert)(\(.+\))?!?:\s*(.+)$/i;
            for (const subject of subjects) {
              const m = subject.match(re);
              if (!m) {
                buckets.other.push(subject);
                continue;
              }
              const type = m[1].toLowerCase();
              const body = m[3];
              if (buckets[type]) {
                buckets[type].push(body);
              } else {
                buckets.other.push(subject);
              }
            }

            const section = (title, items) => {
              if (!items.length) return '';
              return `### ${title}\n\n${items.map((i) => `- ${i}`).join('\n')}\n\n`;
            };

            let body = `## ${process.env.RELEASE_TITLE || `PixelPlayer ${version}`}\n\n`;
            if (version.startsWith('continuous-')) {
              body += '_Automatic build from `master`. Use a manual / tagged release for stable version numbers._\n\n';
            }
            const typed =
              section('Features', buckets.feat) +
              section('Fixes', buckets.fix) +
              section('Performance', buckets.perf) +
              section('Refactors', buckets.refactor) +
              section('Docs', buckets.docs) +
              section('Chores', buckets.chore) +
              section('Other', buckets.other);
            body += typed || '_No conventional commits in this range._\n\n';
            const repo = process.env.GITHUB_REPOSITORY;
            const arm64Name = `PixelPlayer-${version}-arm64-v8a.apk`;
            const armName = `PixelPlayer-${version}-armeabi-v7a.apk`;
            const arm64Url = `https://github.com/${repo}/releases/download/${tag}/${arm64Name}`;
            const armUrl = `https://github.com/${repo}/releases/download/${tag}/${armName}`;
            body += [
              '### Downloads',
              '',
              `- [${arm64Name}](${arm64Url}) — modern 64-bit devices (recommended)`,
              `- [${armName}](${armUrl}) — older 32-bit devices`,
              '',
              '> CI builds use the repository CI keystore (not the store/Play signing key).',
              '',
              'You can also expand **Assets** below on this release page.',
              '',
            ].join('\n');

            core.setOutput('body', body);
            await core.summary.addHeading(`Release ${tag}`).addRaw(body).write();
        env:
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: ${{ steps.notes.outputs.body }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease != 'true' }}
          files: |
            dist/PixelPlayer-${{ steps.meta.outputs.version }}-arm64-v8a.apk
            dist/PixelPlayer-${{ steps.meta.outputs.version }}-armeabi-v7a.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PixelPlayer-${{ steps.meta.outputs.version }}-release-apks
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
